<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Zen Stock">
    <title>Zen Market Watch - 台股</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.ico">
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --border-color: #222222;
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent-blue: #2962ff;
            --color-up: #26a69a;
            --color-down: #ef5350;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: var(--text-primary);
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Chart Area */
        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }

        .chart-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .current-stock-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 140px;
        }

        .interval-buttons {
            display: flex;
            gap: 4px;
        }

        .interval-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .interval-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .interval-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        /* Notes Section */
        .notes-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .notes-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .notes-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text-primary);
            font-size: 13px;
            width: 320px;
        }

        .notes-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .notes-input::placeholder {
            color: var(--text-muted);
        }

        .save-notes-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .save-notes-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        .chart-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Watchlist Panel */
        .watchlist-section {
            width: 340px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
        }

        .watchlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 6px;
        }

        .watchlist-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .watchlist-title img {
            width: 18px;
            height: 18px;
        }

        /* Login Button */
        .login-section {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 10px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .login-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .login-btn .google-icon {
            width: 14px;
            height: 14px;
        }

        /* User Avatar when logged in */
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--color-up);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
        }

        .logout-btn:hover {
            border-color: var(--color-down);
            color: var(--color-down);
        }

        /* Tooltip for login disclaimer */
        .login-tooltip {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--text-secondary);
            width: 220px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            margin-top: 8px;
            line-height: 1.5;
            text-align: left;
        }

        .login-tooltip::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid var(--border-color);
        }

        .login-section:hover .login-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .sync-status {
            font-size: 10px;
            color: var(--color-up);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-status.local {
            color: var(--text-muted);
        }

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .refresh-source {
            color: var(--color-up);
            font-weight: 500;
        }

        .refresh-source.demo {
            color: var(--text-muted);
        }

        .refresh-time {
            color: var(--text-muted);
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 10px 8px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            user-select: none;
        }

        .tab-btn:hover {
            color: var(--text-secondary);
            background: var(--bg-tertiary);
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            z-index: 100;
        }

        .tab-btn:hover::after {
            opacity: 1;
            visibility: visible;
        }

        .tab-btn.renaming {
            background: var(--accent-blue);
            color: white;
        }

        /* Search Box */
        .search-box {
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        /* Search Suggestions */
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 14px;
            right: 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 200;
            display: none;
        }

        .search-suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover,
        .suggestion-item.selected {
            background: var(--accent-blue);
            color: white;
        }

        .suggestion-code {
            font-weight: 600;
            font-size: 13px;
        }

        .suggestion-name {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .suggestion-item:hover .suggestion-name,
        .suggestion-item.selected .suggestion-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .search-input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .add-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        .watchlist-content {
            flex: 1;
            overflow-y: auto;
        }

        /* Stock Item */
        .stock-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
            user-select: none;
        }

        .stock-item:hover {
            background: var(--bg-tertiary);
        }

        .stock-item.active {
            background: rgba(41, 98, 255, 0.12);
            border-left: 3px solid var(--accent-blue);
        }

        .stock-item.dragging {
            opacity: 0.5;
            background: var(--bg-tertiary);
        }

        .stock-item.drag-over {
            border-top: 2px solid var(--accent-blue);
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-muted);
            padding: 4px 8px 4px 0;
            font-size: 14px;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .stock-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .stock-code {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stock-name {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stock-price-data {
            text-align: right;
            margin-right: 10px;
        }

        .price-main {
            font-size: 16px;
            font-weight: 600;
        }

        .price-change {
            font-size: 12px;
            margin-top: 2px;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .delete-btn:hover {
            background: var(--color-down);
            border-color: var(--color-down);
            color: white;
        }

        .up {
            color: var(--color-up);
        }

        .down {
            color: var(--color-down);
        }

        .flat {
            color: var(--text-muted);
        }

        /* Storage Info */
        .storage-info {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
        }

        .reset-btn:hover {
            border-color: var(--color-down);
            color: var(--color-down);
        }

        /* Scrollbar */
        .watchlist-content::-webkit-scrollbar {
            width: 4px;
        }

        .watchlist-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .watchlist-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .notes-section {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .chart-section {
                height: 50%;
            }

            .watchlist-section {
                width: 100%;
                height: 50%;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }

            .chart-toolbar {
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .interval-buttons {
                display: flex;
                position: fixed;
                bottom: 60px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--bg-tertiary);
                padding: 6px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                z-index: 100;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 13px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Chart Section -->
        <div class="chart-section">
            <div class="chart-toolbar">
                <span id="currentStockLabel" class="current-stock-label">0050 元大台灣50</span>
                <div class="interval-buttons">
                    <button class="interval-btn active" data-interval="D" onclick="changeInterval('D')">日K</button>
                    <button class="interval-btn" data-interval="W" onclick="changeInterval('W')">週K</button>
                    <button class="interval-btn" data-interval="M" onclick="changeInterval('M')">月K</button>
                </div>
                <div class="notes-section">
                    <span class="notes-label">📝</span>
                    <input type="text" id="notesInput" class="notes-input" placeholder="輸入此股票的備註..." maxlength="50"
                        oninput="autoSaveNotes()">
                    <button class="save-notes-btn" onclick="saveNotes()">💾 儲存</button>
                </div>
            </div>
            <div class="chart-container">
                <div id="chart"></div>
                <div id="chartLoading" class="chart-loading">載入中...</div>
            </div>
        </div>

        <!-- Watchlist Section -->
        <div class="watchlist-section">
            <div class="watchlist-header">
                <span class="watchlist-title">
                    <img src="favicon.ico" alt="icon">
                    即時報價
                </span>

                <!-- Login Section -->
                <div class="login-section" id="loginSection">
                    <button class="login-btn" id="loginBtn" onclick="handleGoogleLogin()">
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        登入
                    </button>
                    <div class="login-tooltip">
                        🔒 <b>隱私聲明</b><br>
                        僅使用 Google 帳號驗證身份，<br>
                        <b>不會存取</b>您的任何 Google 資料。<br>
                        股票清單儲存於獨立資料庫。
                    </div>
                </div>

                <!-- User Info (shown when logged in) -->
                <div class="login-section" id="userSection" style="display: none;">
                    <span class="sync-status" id="syncStatus">☁️ 雲端同步</span>
                    <img class="user-avatar" id="userAvatar" src="" alt="avatar">
                    <button class="logout-btn" onclick="handleLogout()">登出</button>
                </div>

                <div class="refresh-info">
                    <span id="refreshSource" class="refresh-source">載入中</span>
                    <span id="refreshTime" class="refresh-time"></span>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-nav" id="tabNav">
                <button class="tab-btn active" data-tab="1" data-tooltip="長按修改名稱" onclick="switchTab(1)"
                    onmousedown="startTabRename(1, event)" onmouseup="cancelTabRename()"
                    onmouseleave="cancelTabRename()" ontouchstart="startTabRename(1, event)"
                    ontouchend="cancelTabRename()">清單 1</button>
                <button class="tab-btn" data-tab="2" data-tooltip="長按修改名稱" onclick="switchTab(2)"
                    onmousedown="startTabRename(2, event)" onmouseup="cancelTabRename()"
                    onmouseleave="cancelTabRename()" ontouchstart="startTabRename(2, event)"
                    ontouchend="cancelTabRename()">清單 2</button>
                <button class="tab-btn" data-tab="3" data-tooltip="長按修改名稱" onclick="switchTab(3)"
                    onmousedown="startTabRename(3, event)" onmouseup="cancelTabRename()"
                    onmouseleave="cancelTabRename()" ontouchstart="startTabRename(3, event)"
                    ontouchend="cancelTabRename()">清單 3</button>
            </div>

            <div class="search-box">
                <div class="search-input-group">
                    <input type="text" id="searchInput" class="search-input" placeholder="輸入代碼或公司名稱"
                        oninput="handleSearchInput(event)" onkeydown="handleSearchKeydown(event)"
                        onfocus="showSuggestions()" onblur="hideSuggestionsDelayed()">
                    <button class="add-btn" onclick="addStock()">＋ 新增</button>
                </div>
                <div id="searchSuggestions" class="search-suggestions"></div>
            </div>

            <div id="watchlist" class="watchlist-content"></div>

            <div class="storage-info">
                <span id="storageStatus">💾 本地儲存</span>
                <button class="reset-btn" onclick="resetToDefault()">重設預設</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ===== Firebase Configuration =====
        // Firebase 專案設定
        const firebaseConfig = {
            apiKey: "AIzaSyCg8PTje0mM67zNPHB0z76vsuVw3JG1H2k",
            authDomain: "chrolens-stock.firebaseapp.com",
            projectId: "chrolens-stock",
            storageBucket: "chrolens-stock.firebasestorage.app",
            messagingSenderId: "888417539856",
            appId: "1:888417539856:web:414a029628af9df31a7795",
            measurementId: "G-GMJ8044T62"
        };

        // Initialize Firebase (only if config is set)
        let db = null;
        let auth = null;
        let currentUser = null;
        let isFirebaseConfigured = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseConfigured = true;

                // Listen for auth state changes
                auth.onAuthStateChanged(user => {
                    currentUser = user;
                    updateAuthUI();
                    if (user) {
                        loadFromFirestore();
                    }
                });
            }
        } catch (e) {
            console.warn('Firebase not configured:', e);
        }

        // ===== Default Stocks =====
        // 靜態預設（API 無法取得時的備用）
        const FALLBACK_STOCKS = [

                s.code.toLowerCase().includes(q) ||
                s.name.toLowerCase().includes(q)
            ).slice(0, 8);
        }

        // 顯示搜尋建議
        function showSuggestions() {
            const input = document.getElementById('searchInput');

            const container = document.getElementById('searchSuggestions');

            if (results.length === 0) {
                container.classList.remove('show');
                return;
            }

            container.innerHTML = results.map((s, i) => `
                <div class="suggestion-item ${i === searchSuggestionIndex ? 'selected' : ''}" 
                     onmousedown="selectSuggestion('${s.code}', '${s.name}')">
                    <span class="suggestion-code">${s.code}</span>
                    <span class="suggestion-name">${s.name}</span>
                </div>
            `).join('');
            container.classList.add('show');
        }

            showSuggestions();

        function handleSearchKeydown(e) {
            const container = document.getElementById('searchSuggestions');
            const items = container.querySelectorAll('.suggestion-item');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                searchSuggestionIndex = Math.min(searchSuggestionIndex + 1, items.length - 1);
                showSuggestions();
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                searchSuggestionIndex = Math.max(searchSuggestionIndex - 1, -1);
                showSuggestions();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (searchSuggestionIndex >= 0 && items[searchSuggestionIndex]) {
                    items[searchSuggestionIndex].click();
                } else {
                    addStock();
                }
                container.classList.remove('show');
            } else if (e.key === 'Escape') {
                container.classList.remove('show');
            }
        }

        // 動態抓取成交量排行前20名
        async function fetchTopVolumeStocks() {
            try {
                const json = await fetchWithProxy('https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX20?response=json');
                if (json.stat !== 'OK' || !json.data) return FALLBACK_STOCKS;

                const excludeCodes = ['2330', '0050']; // 已經固定的股票
                const topStocks = json.data.map(row => ({
                    code: String(row[1]).trim(),
                    name: String(row[2]).trim()
                })).filter(s => !excludeCodes.includes(s.code));

                // 判斷是否為 ETF（代碼以 00 開頭且長度 >= 5）
                const isETF = code => code.startsWith('00') && code.length >= 5;

                // 分離個股和 ETF
                const individualStocks = topStocks.filter(s => !isETF(s.code));
                const etfs = topStocks.filter(s => isETF(s.code));

                // 組合：台積電 + 0050 + 2隻個股 + 2隻ETF
                const result = [
                    { code: '2330', name: '台積電' },
                    { code: '0050', name: '元大台灣50' },
                    ...individualStocks.slice(0, 2),
                    ...etfs.slice(0, 2)
                ];

                console.log('動態預設股票:', result);
                return result;
            } catch (e) {
                console.warn('無法取得成交量排行，使用預設清單');
                return FALLBACK_STOCKS;
            }
        }

        // ===== Auth Functions =====
        async function handleGoogleLogin() {
            if (!isFirebaseConfigured) {
                showToast('Firebase 尚未設定，請先完成設定');
                return;
            }

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });

                // 嘗試使用 popup，如果失敗則使用 redirect
                try {
                    await auth.signInWithPopup(provider);
                    showToast('登入成功！資料將雲端同步');
                } catch (popupError) {
                    console.log('Popup failed, trying redirect...', popupError.code);
                    // 如果 popup 被阻擋或失敗，使用 redirect 方式
                    if (popupError.code === 'auth/popup-blocked' ||
                        popupError.code === 'auth/popup-closed-by-user' ||
                        popupError.code === 'auth/cancelled-popup-request') {
                        showToast('正在跳轉到 Google 登入...');
                        await auth.signInWithRedirect(provider);
                    } else {
                        throw popupError;
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('登入失敗：' + error.message);
            }
        }

        // ===== Firestore Functions =====
        async function loadFromFirestore() {
            if (!db || !currentUser) return;

            try {
                const doc = await db.collection('users').doc(currentUser.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.stocks && data.stocks.length > 0) {
                        stocks = data.stocks;
                        renderWatchlist();
                        updateCurrentStockLabel();
                        showToast('已載入雲端資料');
                    }
                    // Load notes
                    if (data.notes) {
                        Object.keys(data.notes).forEach(code => {
                            localStorage.setItem(NOTES_PREFIX + code, data.notes[code]);
                        });
                        loadNotes(currentStock);
                    }
                } else {
                    // First time user, save current local data to cloud
                    await saveToFirestore();
                }
                updateSyncStatus('synced');
            } catch (error) {
                console.error('Firestore load error:', error);
                updateSyncStatus('error');
            }
        }

        async function saveToFirestore() {
            if (!db || !currentUser) return;

            try {
                updateSyncStatus('syncing');

                // Collect all notes
                const notes = {};
                stocks.forEach(s => {
                    const note = localStorage.getItem(NOTES_PREFIX + s.code);
                    if (note) notes[s.code] = note;
                });

                await db.collection('users').doc(currentUser.uid).set({
                    stocks: stocks,
                    notes: notes,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                updateSyncStatus('synced');
            } catch (error) {
                console.error('Firestore save error:', error);
                updateSyncStatus('error');
            }
        }

        function updateSyncStatus(status) {
            const syncEl = document.getElementById('syncStatus');
            if (!syncEl) return;

            switch (status) {
                case 'syncing':
                    syncEl.textContent = '🔄 同步中...';
                    syncEl.style.color = '#ffc107';
                    break;
                case 'synced':
                    syncEl.textContent = '☁️ 已同步';
                    syncEl.style.color = '#26a69a';
                    break;
                case 'error':
                    syncEl.textContent = '⚠️ 同步失敗';
                    syncEl.style.color = '#ef5350';
                    break;
            }
        }

            if (stocks.find(s => s.code === code)) { showToast('此股票已在清單中'); return; }

            saveStocks();
            input.value = '';

            fetchQuotes();
            showToast(`已新增 ${code} ${name}`);

        function generateDemoData(stockCode) {
            const data = [];
            const basePrice = getBasePrice(stockCode);
            let price = basePrice * 0.97;
            const now = new Date();

            for (let i = 30; i >= 0; i--) {
                const date = new Date(now);
                date.setDate(date.getDate() - i);
                if (date.getDay() === 0 || date.getDay() === 6) continue;

                const change = (Math.random() - 0.48) * basePrice * 0.02;
                const open = price;
                price = Math.max(basePrice * 0.9, Math.min(basePrice * 1.1, price + change));
                const close = price;
                const high = Math.max(open, close) * (1 + Math.random() * 0.01);
                const low = Math.min(open, close) * (1 - Math.random() * 0.01);
                const volume = Math.floor(Math.random() * 30000 + 5000) * 1000;

                data.push({
                    time: date.toISOString().split('T')[0],
                    open: +open.toFixed(2), high: +high.toFixed(2),
                    low: +low.toFixed(2), close: +close.toFixed(2), volume
                });
            }
            return data;
        }

        function getBasePrice(code) {
            return {
                '0050': 152, '0056': 36, '00878': 22, '00918': 21, '00919': 25, '00929': 22,
                '1514': 185, '2330': 1025, '2884': 29, '2885': 26, '2317': 165, '2454': 1150
            }[code] || 100;
        }

        function generateDemoQuotes() {
            stocks.forEach(stock => {
                const basePrice = getBasePrice(stock.code);
                const changePercent = (Math.random() - 0.5) * 3;
                const price = basePrice * (1 + changePercent / 100);
                priceData[stock.code] = {
                    price: +price.toFixed(2),
                    change: +(price - basePrice).toFixed(2),
                    changePercent: +changePercent.toFixed(2)
                };
            });
        }

        async function fetchWithProxy(url) {
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                const idx = (proxyIndex + i) % CORS_PROXIES.length;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const response = await fetch(CORS_PROXIES[idx] + encodeURIComponent(url), {
                        signal: controller.signal, headers: { 'Accept': 'application/json' }
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) { proxyIndex = idx; return await response.json(); }
                } catch (e) { }
            }
            throw new Error('Failed');
        }

        async function fetchHistoricalData(stockCode, interval = 'D') {
            showLoading(true);
            let allData = [];

            try {
                // 抓取 36 個月（3年）的資料
                const dates = getDateRange(36);
                for (const date of dates) {
                    try {
                        const json = await fetchWithProxy(`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${date}&stockNo=${stockCode}`);
                        if (json.data?.length) {
                            allData = allData.concat(parseStockDayData(json.data));
                        }
                        // 增加微小延遲避免被 TWSE API 阻斷 (Rate Limiting)
                        await new Promise(r => setTimeout(r, 150));
                    } catch (e) {
                        console.warn(`月分 ${date} 抓取失敗`, e);
                    }
                }
            } catch (e) { }

            if (!allData.length) allData = generateDemoData(stockCode);
            allData.sort((a, b) => a.time.localeCompare(b.time));

            // 移除 30 天限制，保留所有資料供使用者瀏覽

            if (interval === 'W') allData = aggregateToWeekly(allData);
            else if (interval === 'M') allData = aggregateToMonthly(allData);

            if (allData.length) {
                candlestickSeries.setData(allData);
                volumeSeries.setData(allData.map(d => ({
                    time: d.time, value: d.volume || 0,
                    color: d.close >= d.open ? '#26a69a80' : '#ef535080'
                })));
                // 顯示最近 30 天，但使用者可以往回滑動查看更早的資料
                const now = new Date();
                const thirtyDaysAgo = new Date(now);
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                chart.timeScale().setVisibleRange({
                    from: thirtyDaysAgo.getTime() / 1000,
                    to: now.getTime() / 1000
                });
            }
            showLoading(false);
        }

        function parseStockDayData(data) {
            return data.map(row => {
                const [year, month, day] = row[0].split('/');
                const open = parseFloat(row[3].replace(/,/g, '')) || 0;
                const close = parseFloat(row[6].replace(/,/g, '')) || 0;
                if (!open || !close) return null;
                return {
                    time: `${+year + 1911}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`,
                    open, high: parseFloat(row[4].replace(/,/g, '')) || 0,
                    low: parseFloat(row[5].replace(/,/g, '')) || 0, close,
                    volume: parseInt(row[1].replace(/,/g, '')) || 0
                };
            }).filter(d => d);
        }

        function getDateRange(months) {
            const dates = [], now = new Date();
            for (let i = 0; i < months; i++) {
                // 回傳 YYYYMMDD 格式 (西元)，API 較穩定接受此格式
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                dates.push(`${year}${month}01`);
            }
            return dates.reverse();
        }

        function aggregateToWeekly(data) {
            const weeks = {};
            data.forEach(d => {
                const date = new Date(d.time), weekStart = new Date(date);
                weekStart.setDate(date.getDate() - date.getDay());
                const key = weekStart.toISOString().split('T')[0];
                if (!weeks[key]) weeks[key] = { ...d, time: key };
                else {
                    weeks[key].high = Math.max(weeks[key].high, d.high);
                    weeks[key].low = Math.min(weeks[key].low, d.low);
                    weeks[key].close = d.close;
                    weeks[key].volume += d.volume;
                }
            });
            return Object.values(weeks).sort((a, b) => a.time.localeCompare(b.time));
        }

        function aggregateToMonthly(data) {
            const months = {};
            data.forEach(d => {
                const key = d.time.substring(0, 7) + '-01';
                if (!months[key]) months[key] = { ...d, time: key };
                else {
                    months[key].high = Math.max(months[key].high, d.high);
                    months[key].low = Math.min(months[key].low, d.low);
                    months[key].close = d.close;
                    months[key].volume += d.volume;
                }
            });
            return Object.values(months).sort((a, b) => a.time.localeCompare(b.time));
        }

        async function fetchQuotes() {
            const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${stocks.map(s => `tse_${s.code}.tw`).join('|')}&json=1&delay=0&_=${Date.now()}`;
            try {
                const json = await fetchWithProxy(url);
                if (json.msgArray?.length) {
                    json.msgArray.forEach(item => {
                        const price = parseFloat(item.z) || parseFloat(item.pz) || 0;
                        const yesterday = parseFloat(item.y) || 0;
                        if (price > 0) {
                            priceData[item.c] = { price, change: price - yesterday, changePercent: yesterday ? (price - yesterday) / yesterday * 100 : 0 };
                            const s = stocks.find(s => s.code === item.c);
                            if (s && item.n) s.name = item.n;
                        }
                    });
                    saveStocks(); updateCurrentStockLabel(); renderWatchlist(); updateRefreshStatus('即時');
                    return;
                }
            } catch (e) { }
            generateDemoQuotes(); renderWatchlist(); updateRefreshStatus('模擬');
        }

        function renderWatchlist() {
            document.getElementById('watchlist').innerHTML = stocks.map((stock, i) => {
                const d = priceData[stock.code] || {};
                const price = d.price ? d.price.toFixed(2) : '--';
                const change = d.change || 0, pct = d.changePercent || 0;
                const cls = change > 0 ? 'up' : (change < 0 ? 'down' : 'flat');
                const sign = change > 0 ? '+' : '';

                return `<div class="stock-item ${stock.code === currentStock ? 'active' : ''}" 
                    draggable="true" ondragstart="handleDragStart(event,${i})" ondragend="handleDragEnd(event)"
                    ondragover="handleDragOver(event,${i})" ondrop="handleDrop(event,${i})" onclick="selectStock('${stock.code}')">
                    <span class="drag-handle">☰</span>
                    <div class="stock-info">
                        <div class="stock-code">${stock.code}</div>
                        <div class="stock-name">${stock.name}</div>
                    </div>
                    <div class="stock-price-data">
                        <div class="price-main ${cls}">${price}</div>
                        <div class="price-change ${cls}">${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)</div>
                    </div>
                    <button class="delete-btn" onclick="removeStock('${stock.code}',event)">✕</button>
                </div>`;
            }).join('');
        }

        function updateRefreshStatus(mode) {
            const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const src = document.getElementById('refreshSource'), tm = document.getElementById('refreshTime');
            src.textContent = mode === '即時' ? 'TWSE API' : '模擬資料';
            src.className = 'refresh-source' + (mode === '即時' ? '' : ' demo');
            tm.textContent = time;
        }

        function selectStock(code) {
            currentStock = code;
            updateCurrentStockLabel();
            loadNotes(code);
            renderWatchlist();
            fetchHistoricalData(code, currentInterval);
        }

        function changeInterval(interval) {
            currentInterval = interval;
            document.querySelectorAll('.interval-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.interval === interval));
            fetchHistoricalData(currentStock, interval);
        }

        function showLoading(show) {
            document.getElementById('chartLoading').style.display = show ? 'block' : 'none';
        }

        async function init() {
            loadStocks();
            loadTabNames(); // 載入選單名稱
            initChart();
            updateCurrentStockLabel();
            loadNotes(currentStock);
            updateAuthUI();
            generateDemoQuotes();
            renderWatchlist();

            // 載入股票名稱對照表（背景執行，用於中文搜尋）
            loadStockList();

            await Promise.all([fetchHistoricalData(currentStock, currentInterval), fetchQuotes()]);
            setInterval(() => fetchQuotes(), 60000);
        }

        init();
    </script>
</body>
