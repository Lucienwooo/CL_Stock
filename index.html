<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Market Watch - 台股</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --border-color: #222222;
            --text-primary: #e0e0e0;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent-blue: #2962ff;
            --color-up: #26a69a;
            --color-down: #ef5350;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            color: var(--text-primary);
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Chart Area */
        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-primary);
        }

        .chart-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .current-stock-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 140px;
        }

        .interval-buttons {
            display: flex;
            gap: 4px;
        }

        .interval-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .interval-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .interval-btn.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        /* Notes Section */
        .notes-section {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .notes-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .notes-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            color: var(--text-primary);
            font-size: 13px;
            width: 320px;
        }

        .notes-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .notes-input::placeholder {
            color: var(--text-muted);
        }

        .save-notes-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .save-notes-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        .chart-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Watchlist Panel */
        .watchlist-section {
            width: 340px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
        }

        .watchlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 6px;
        }

        .watchlist-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .watchlist-title img {
            width: 18px;
            height: 18px;
        }

        /* Login Button */
        .login-section {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 10px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .login-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .login-btn .google-icon {
            width: 14px;
            height: 14px;
        }

        /* User Avatar when logged in */
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--color-up);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
            color: var(--text-muted);
            font-size: 10px;
            cursor: pointer;
        }

        .logout-btn:hover {
            border-color: var(--color-down);
            color: var(--color-down);
        }

        /* Tooltip for login disclaimer */
        .login-tooltip {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 11px;
            color: var(--text-secondary);
            width: 220px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            margin-top: 8px;
            line-height: 1.5;
            text-align: left;
        }

        .login-tooltip::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 6px solid var(--border-color);
        }

        .login-section:hover .login-tooltip {
            opacity: 1;
            visibility: visible;
        }

        .sync-status {
            font-size: 10px;
            color: var(--color-up);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-status.local {
            color: var(--text-muted);
        }

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .refresh-source {
            color: var(--color-up);
            font-weight: 500;
        }

        .refresh-source.demo {
            color: var(--text-muted);
        }

        .refresh-time {
            color: var(--text-muted);
        }

        /* Search Box */
        .search-box {
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .add-btn {
            background: var(--accent-blue);
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        .watchlist-content {
            flex: 1;
            overflow-y: auto;
        }

        /* Stock Item */
        .stock-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
            user-select: none;
        }

        .stock-item:hover {
            background: var(--bg-tertiary);
        }

        .stock-item.active {
            background: rgba(41, 98, 255, 0.12);
            border-left: 3px solid var(--accent-blue);
        }

        .stock-item.dragging {
            opacity: 0.5;
            background: var(--bg-tertiary);
        }

        .stock-item.drag-over {
            border-top: 2px solid var(--accent-blue);
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-muted);
            padding: 4px 8px 4px 0;
            font-size: 14px;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .stock-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .stock-code {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stock-name {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stock-price-data {
            text-align: right;
            margin-right: 10px;
        }

        .price-main {
            font-size: 16px;
            font-weight: 600;
        }

        .price-change {
            font-size: 12px;
            margin-top: 2px;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .delete-btn:hover {
            background: var(--color-down);
            border-color: var(--color-down);
            color: white;
        }

        .up {
            color: var(--color-up);
        }

        .down {
            color: var(--color-down);
        }

        .flat {
            color: var(--text-muted);
        }

        /* Storage Info */
        .storage-info {
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
        }

        .reset-btn:hover {
            border-color: var(--color-down);
            color: var(--color-down);
        }

        /* Scrollbar */
        .watchlist-content::-webkit-scrollbar {
            width: 4px;
        }

        .watchlist-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .watchlist-content::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .notes-section {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .chart-section {
                height: 50%;
            }

            .watchlist-section {
                width: 100%;
                height: 50%;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }

            .chart-toolbar {
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .interval-buttons {
                display: none;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 13px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Chart Section -->
        <div class="chart-section">
            <div class="chart-toolbar">
                <span id="currentStockLabel" class="current-stock-label">0050 元大台灣50</span>
                <div class="interval-buttons">
                    <button class="interval-btn active" data-interval="D" onclick="changeInterval('D')">日K</button>
                    <button class="interval-btn" data-interval="W" onclick="changeInterval('W')">週K</button>
                    <button class="interval-btn" data-interval="M" onclick="changeInterval('M')">月K</button>
                </div>
                <div class="notes-section">
                    <span class="notes-label">📝</span>
                    <input type="text" id="notesInput" class="notes-input" placeholder="輸入此股票的備註..." maxlength="50"
                        oninput="autoSaveNotes()">
                    <button class="save-notes-btn" onclick="saveNotes()">💾 儲存</button>
                </div>
            </div>
            <div class="chart-container">
                <div id="chart"></div>
                <div id="chartLoading" class="chart-loading">載入中...</div>
            </div>
        </div>

        <!-- Watchlist Section -->
        <div class="watchlist-section">
            <div class="watchlist-header">
                <span class="watchlist-title">
                    <img src="favicon.ico" alt="icon">
                    即時報價
                </span>

                <!-- Login Section -->
                <div class="login-section" id="loginSection">
                    <button class="login-btn" id="loginBtn" onclick="handleGoogleLogin()">
                        <svg class="google-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="#34A853"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="#FBBC05"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="#EA4335"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        登入
                    </button>
                    <div class="login-tooltip">
                        🔒 <b>隱私聲明</b><br>
                        僅使用 Google 帳號驗證身份，<br>
                        <b>不會存取</b>您的任何 Google 資料。<br>
                        股票清單儲存於獨立資料庫。
                    </div>
                </div>

                <!-- User Info (shown when logged in) -->
                <div class="login-section" id="userSection" style="display: none;">
                    <span class="sync-status" id="syncStatus">☁️ 雲端同步</span>
                    <img class="user-avatar" id="userAvatar" src="" alt="avatar">
                    <button class="logout-btn" onclick="handleLogout()">登出</button>
                </div>

                <div class="refresh-info">
                    <span id="refreshSource" class="refresh-source">載入中</span>
                    <span id="refreshTime" class="refresh-time"></span>
                </div>
            </div>

            <div class="search-box">
                <div class="search-input-group">
                    <input type="text" id="searchInput" class="search-input" placeholder="輸入股票代碼 (如: 2317)"
                        onkeypress="handleSearchKeypress(event)">
                    <button class="add-btn" onclick="addStock()">＋ 新增</button>
                </div>
            </div>

            <div id="watchlist" class="watchlist-content"></div>

            <div class="storage-info">
                <span id="storageStatus">💾 本地儲存</span>
                <button class="reset-btn" onclick="resetToDefault()">重設預設</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ===== Firebase Configuration =====
        // TODO: 請將此處替換為你的 Firebase 專案設定
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase (only if config is set)
        let db = null;
        let auth = null;
        let currentUser = null;
        let isFirebaseConfigured = false;

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                db = firebase.firestore();
                isFirebaseConfigured = true;

                // Listen for auth state changes
                auth.onAuthStateChanged(user => {
                    currentUser = user;
                    updateAuthUI();
                    if (user) {
                        loadFromFirestore();
                    }
                });
            }
        } catch (e) {
            console.warn('Firebase not configured:', e);
        }

        // ===== Default Stocks =====
        const DEFAULT_STOCKS = [
            { code: '0050', name: '元大台灣50' },
            { code: '0056', name: '元大高股息' },
            { code: '00878', name: '國泰永續高股息' },
            { code: '00918', name: '大華優利高填息30' },
            { code: '00919', name: '群益台灣精選高息' },
            { code: '00929', name: '復華台灣科技優息' },
            { code: '1514', name: '亞力' },
            { code: '2330', name: '台積電' },
            { code: '2884', name: '玉山金' },
            { code: '2885', name: '元大金' }
        ];

        const STORAGE_KEY = 'zen_watchlist';
        const NOTES_PREFIX = 'zen_note_';
        const CORS_PROXIES = ['https://corsproxy.io/?', 'https://api.allorigins.win/raw?url='];

        let stocks = [], currentStock = '', currentInterval = 'D';
        let chart = null, candlestickSeries = null, volumeSeries = null;
        let priceData = {}, proxyIndex = 0, draggedItem = null, notesAutoSaveTimer = null;

        // ===== Auth Functions =====
        async function handleGoogleLogin() {
            if (!isFirebaseConfigured) {
                showToast('Firebase 尚未設定，請先完成設定');
                return;
            }

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                await auth.signInWithPopup(provider);
                showToast('登入成功！資料將雲端同步');
            } catch (error) {
                if (error.code === 'auth/popup-closed-by-user') {
                    return; // User closed popup
                }
                console.error('Login error:', error);
                showToast('登入失敗：' + error.message);
            }
        }

        async function handleLogout() {
            if (!auth) return;
            try {
                await auth.signOut();
                currentUser = null;
                updateAuthUI();
                showToast('已登出，切換為本地儲存');
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function updateAuthUI() {
            const loginSection = document.getElementById('loginSection');
            const userSection = document.getElementById('userSection');
            const storageStatus = document.getElementById('storageStatus');

            if (currentUser) {
                loginSection.style.display = 'none';
                userSection.style.display = 'flex';
                document.getElementById('userAvatar').src = currentUser.photoURL || 'favicon.ico';
                storageStatus.textContent = '☁️ 雲端同步';
                storageStatus.style.color = '#26a69a';
            } else {
                loginSection.style.display = 'flex';
                userSection.style.display = 'none';
                storageStatus.textContent = '💾 本地儲存';
                storageStatus.style.color = '';
            }
        }

        // ===== Firestore Functions =====
        async function loadFromFirestore() {
            if (!db || !currentUser) return;

            try {
                const doc = await db.collection('users').doc(currentUser.uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.stocks && data.stocks.length > 0) {
                        stocks = data.stocks;
                        renderWatchlist();
                        updateCurrentStockLabel();
                        showToast('已載入雲端資料');
                    }
                    // Load notes
                    if (data.notes) {
                        Object.keys(data.notes).forEach(code => {
                            localStorage.setItem(NOTES_PREFIX + code, data.notes[code]);
                        });
                        loadNotes(currentStock);
                    }
                } else {
                    // First time user, save current local data to cloud
                    await saveToFirestore();
                }
                updateSyncStatus('synced');
            } catch (error) {
                console.error('Firestore load error:', error);
                updateSyncStatus('error');
            }
        }

        async function saveToFirestore() {
            if (!db || !currentUser) return;

            try {
                updateSyncStatus('syncing');

                // Collect all notes
                const notes = {};
                stocks.forEach(s => {
                    const note = localStorage.getItem(NOTES_PREFIX + s.code);
                    if (note) notes[s.code] = note;
                });

                await db.collection('users').doc(currentUser.uid).set({
                    stocks: stocks,
                    notes: notes,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                updateSyncStatus('synced');
            } catch (error) {
                console.error('Firestore save error:', error);
                updateSyncStatus('error');
            }
        }

        function updateSyncStatus(status) {
            const syncEl = document.getElementById('syncStatus');
            if (!syncEl) return;

            switch (status) {
                case 'syncing':
                    syncEl.textContent = '🔄 同步中...';
                    syncEl.style.color = '#ffc107';
                    break;
                case 'synced':
                    syncEl.textContent = '☁️ 已同步';
                    syncEl.style.color = '#26a69a';
                    break;
                case 'error':
                    syncEl.textContent = '⚠️ 同步失敗';
                    syncEl.style.color = '#ef5350';
                    break;
            }
        }

        // ===== localStorage Functions =====
        function loadStocks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                stocks = saved ? JSON.parse(saved) : [...DEFAULT_STOCKS];
                if (!stocks.length) stocks = [...DEFAULT_STOCKS];
            } catch (e) { stocks = [...DEFAULT_STOCKS]; }
            currentStock = stocks[0]?.code || '0050';
        }

        function saveStocks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
                // Also save to Firestore if logged in
                if (currentUser) saveToFirestore();
            } catch (e) { }
        }

        function loadNotes(stockCode) {
            try { document.getElementById('notesInput').value = localStorage.getItem(NOTES_PREFIX + stockCode) || ''; }
            catch (e) { document.getElementById('notesInput').value = ''; }
        }

        function saveNotes() {
            try {
                localStorage.setItem(NOTES_PREFIX + currentStock, document.getElementById('notesInput').value);
                if (currentUser) saveToFirestore();
                showToast(`${currentStock} 備註已儲存`);
            } catch (e) { showToast('儲存失敗'); }
        }

        function autoSaveNotes() {
            if (notesAutoSaveTimer) clearTimeout(notesAutoSaveTimer);
            notesAutoSaveTimer = setTimeout(() => {
                try {
                    localStorage.setItem(NOTES_PREFIX + currentStock, document.getElementById('notesInput').value);
                    if (currentUser) saveToFirestore();
                } catch (e) { }
            }, 1000);
        }

        function resetToDefault() {
            if (confirm('確定要重設為預設清單嗎？（備註不會被刪除）')) {
                stocks = [...DEFAULT_STOCKS];
                saveStocks();
                currentStock = stocks[0].code;
                updateCurrentStockLabel();
                loadNotes(currentStock);
                renderWatchlist();
                fetchHistoricalData(currentStock, currentInterval);
                fetchQuotes();
                showToast('已重設為預設清單');
            }
        }

        function updateCurrentStockLabel() {
            const stock = stocks.find(s => s.code === currentStock);
            document.getElementById('currentStockLabel').textContent = stock ? `${stock.code} ${stock.name}` : currentStock;
        }

        function addStock() {
            const input = document.getElementById('searchInput');
            const code = input.value.trim().toUpperCase();
            if (!code) { showToast('請輸入股票代碼'); return; }
            if (stocks.find(s => s.code === code)) { showToast('此股票已在清單中'); return; }
            stocks.push({ code, name: `股票 ${code}` });
            saveStocks();
            input.value = '';
            renderWatchlist();
            fetchQuotes();
            showToast(`已新增 ${code}`);
        }

        function removeStock(code, event) {
            event.stopPropagation();
            if (stocks.length <= 1) { showToast('至少需要保留一支股票'); return; }
            if (!confirm(`確定要移除 ${code} 嗎？`)) return;
            stocks = stocks.filter(s => s.code !== code);
            saveStocks();
            if (currentStock === code) {
                currentStock = stocks[0].code;
                updateCurrentStockLabel();
                loadNotes(currentStock);
                fetchHistoricalData(currentStock, currentInterval);
            }
            renderWatchlist();
            showToast(`已移除 ${code}`);
        }

        function handleSearchKeypress(event) { if (event.key === 'Enter') addStock(); }

        // Drag and Drop
        function handleDragStart(e, index) {
            draggedItem = index;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', index);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.stock-item').forEach(item => item.classList.remove('drag-over'));
            draggedItem = null;
        }

        function handleDragOver(e, index) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            document.querySelectorAll('.stock-item').forEach((item, i) => {
                item.classList.toggle('drag-over', i === index && i !== draggedItem);
            });
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            if (draggedItem === null || draggedItem === targetIndex) return;
            const [removed] = stocks.splice(draggedItem, 1);
            stocks.splice(targetIndex, 0, removed);
            saveStocks();
            renderWatchlist();
            showToast('順序已更新');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Chart
        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { type: 'solid', color: '#0a0a0a' }, textColor: '#888888' },
                grid: { vertLines: { color: '#1a1a1a' }, horzLines: { color: '#1a1a1a' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#222222' },
                timeScale: { borderColor: '#222222', timeVisible: true },
                handleScroll: true,
                handleScale: true,
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderDownColor: '#ef5350', borderUpColor: '#26a69a',
                wickDownColor: '#ef5350', wickUpColor: '#26a69a',
            });

            volumeSeries = chart.addHistogramSeries({
                color: '#26a69a', priceFormat: { type: 'volume' },
                priceScaleId: '', scaleMargins: { top: 0.8, bottom: 0 },
            });

            new ResizeObserver(entries => {
                if (entries[0]?.target === container) {
                    const { width, height } = entries[0].contentRect;
                    chart.applyOptions({ width, height });
                }
            }).observe(container);
        }

        function generateDemoData(stockCode) {
            const data = [];
            const basePrice = getBasePrice(stockCode);
            let price = basePrice * 0.97;
            const now = new Date();

            for (let i = 30; i >= 0; i--) {
                const date = new Date(now);
                date.setDate(date.getDate() - i);
                if (date.getDay() === 0 || date.getDay() === 6) continue;

                const change = (Math.random() - 0.48) * basePrice * 0.02;
                const open = price;
                price = Math.max(basePrice * 0.9, Math.min(basePrice * 1.1, price + change));
                const close = price;
                const high = Math.max(open, close) * (1 + Math.random() * 0.01);
                const low = Math.min(open, close) * (1 - Math.random() * 0.01);
                const volume = Math.floor(Math.random() * 30000 + 5000) * 1000;

                data.push({
                    time: date.toISOString().split('T')[0],
                    open: +open.toFixed(2), high: +high.toFixed(2),
                    low: +low.toFixed(2), close: +close.toFixed(2), volume
                });
            }
            return data;
        }

        function getBasePrice(code) {
            return {
                '0050': 152, '0056': 36, '00878': 22, '00918': 21, '00919': 25, '00929': 22,
                '1514': 185, '2330': 1025, '2884': 29, '2885': 26, '2317': 165, '2454': 1150
            }[code] || 100;
        }

        function generateDemoQuotes() {
            stocks.forEach(stock => {
                const basePrice = getBasePrice(stock.code);
                const changePercent = (Math.random() - 0.5) * 3;
                const price = basePrice * (1 + changePercent / 100);
                priceData[stock.code] = {
                    price: +price.toFixed(2),
                    change: +(price - basePrice).toFixed(2),
                    changePercent: +changePercent.toFixed(2)
                };
            });
        }

        async function fetchWithProxy(url) {
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                const idx = (proxyIndex + i) % CORS_PROXIES.length;
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    const response = await fetch(CORS_PROXIES[idx] + encodeURIComponent(url), {
                        signal: controller.signal, headers: { 'Accept': 'application/json' }
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) { proxyIndex = idx; return await response.json(); }
                } catch (e) { }
            }
            throw new Error('Failed');
        }

        async function fetchHistoricalData(stockCode, interval = 'D') {
            showLoading(true);
            let allData = [];

            try {
                const dates = getDateRange(1);
                for (const date of dates) {
                    try {
                        const json = await fetchWithProxy(`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&date=${date}&stockNo=${stockCode}`);
                        if (json.data?.length) allData = allData.concat(parseStockDayData(json.data));
                    } catch (e) { }
                }
            } catch (e) { }

            if (!allData.length) allData = generateDemoData(stockCode);
            allData.sort((a, b) => a.time.localeCompare(b.time));

            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const cutoffDate = thirtyDaysAgo.toISOString().split('T')[0];
            allData = allData.filter(d => d.time >= cutoffDate);

            if (interval === 'W') allData = aggregateToWeekly(allData);
            else if (interval === 'M') allData = aggregateToMonthly(allData);

            if (allData.length) {
                candlestickSeries.setData(allData);
                volumeSeries.setData(allData.map(d => ({
                    time: d.time, value: d.volume || 0,
                    color: d.close >= d.open ? '#26a69a80' : '#ef535080'
                })));
                chart.timeScale().fitContent();
            }
            showLoading(false);
        }

        function parseStockDayData(data) {
            return data.map(row => {
                const [year, month, day] = row[0].split('/');
                const open = parseFloat(row[3].replace(/,/g, '')) || 0;
                const close = parseFloat(row[6].replace(/,/g, '')) || 0;
                if (!open || !close) return null;
                return {
                    time: `${+year + 1911}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`,
                    open, high: parseFloat(row[4].replace(/,/g, '')) || 0,
                    low: parseFloat(row[5].replace(/,/g, '')) || 0, close,
                    volume: parseInt(row[1].replace(/,/g, '')) || 0
                };
            }).filter(d => d);
        }

        function getDateRange(months) {
            const dates = [], now = new Date();
            for (let i = 0; i < months; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                dates.push(`${d.getFullYear() - 1911}${String(d.getMonth() + 1).padStart(2, '0')}01`);
            }
            return dates.reverse();
        }

        function aggregateToWeekly(data) {
            const weeks = {};
            data.forEach(d => {
                const date = new Date(d.time), weekStart = new Date(date);
                weekStart.setDate(date.getDate() - date.getDay());
                const key = weekStart.toISOString().split('T')[0];
                if (!weeks[key]) weeks[key] = { ...d, time: key };
                else {
                    weeks[key].high = Math.max(weeks[key].high, d.high);
                    weeks[key].low = Math.min(weeks[key].low, d.low);
                    weeks[key].close = d.close;
                    weeks[key].volume += d.volume;
                }
            });
            return Object.values(weeks).sort((a, b) => a.time.localeCompare(b.time));
        }

        function aggregateToMonthly(data) {
            const months = {};
            data.forEach(d => {
                const key = d.time.substring(0, 7) + '-01';
                if (!months[key]) months[key] = { ...d, time: key };
                else {
                    months[key].high = Math.max(months[key].high, d.high);
                    months[key].low = Math.min(months[key].low, d.low);
                    months[key].close = d.close;
                    months[key].volume += d.volume;
                }
            });
            return Object.values(months).sort((a, b) => a.time.localeCompare(b.time));
        }

        async function fetchQuotes() {
            const url = `https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=${stocks.map(s => `tse_${s.code}.tw`).join('|')}&json=1&delay=0&_=${Date.now()}`;
            try {
                const json = await fetchWithProxy(url);
                if (json.msgArray?.length) {
                    json.msgArray.forEach(item => {
                        const price = parseFloat(item.z) || parseFloat(item.pz) || 0;
                        const yesterday = parseFloat(item.y) || 0;
                        if (price > 0) {
                            priceData[item.c] = { price, change: price - yesterday, changePercent: yesterday ? (price - yesterday) / yesterday * 100 : 0 };
                            const s = stocks.find(s => s.code === item.c);
                            if (s && item.n) s.name = item.n;
                        }
                    });
                    saveStocks(); updateCurrentStockLabel(); renderWatchlist(); updateRefreshStatus('即時');
                    return;
                }
            } catch (e) { }
            generateDemoQuotes(); renderWatchlist(); updateRefreshStatus('模擬');
        }

        function renderWatchlist() {
            document.getElementById('watchlist').innerHTML = stocks.map((stock, i) => {
                const d = priceData[stock.code] || {};
                const price = d.price ? d.price.toFixed(2) : '--';
                const change = d.change || 0, pct = d.changePercent || 0;
                const cls = change > 0 ? 'up' : (change < 0 ? 'down' : 'flat');
                const sign = change > 0 ? '+' : '';

                return `<div class="stock-item ${stock.code === currentStock ? 'active' : ''}" 
                    draggable="true" ondragstart="handleDragStart(event,${i})" ondragend="handleDragEnd(event)"
                    ondragover="handleDragOver(event,${i})" ondrop="handleDrop(event,${i})" onclick="selectStock('${stock.code}')">
                    <span class="drag-handle">☰</span>
                    <div class="stock-info">
                        <div class="stock-code">${stock.code}</div>
                        <div class="stock-name">${stock.name}</div>
                    </div>
                    <div class="stock-price-data">
                        <div class="price-main ${cls}">${price}</div>
                        <div class="price-change ${cls}">${sign}${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)</div>
                    </div>
                    <button class="delete-btn" onclick="removeStock('${stock.code}',event)">✕</button>
                </div>`;
            }).join('');
        }

        function updateRefreshStatus(mode) {
            const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const src = document.getElementById('refreshSource'), tm = document.getElementById('refreshTime');
            src.textContent = mode === '即時' ? 'TWSE API' : '模擬資料';
            src.className = 'refresh-source' + (mode === '即時' ? '' : ' demo');
            tm.textContent = time;
        }

        function selectStock(code) {
            currentStock = code;
            updateCurrentStockLabel();
            loadNotes(code);
            renderWatchlist();
            fetchHistoricalData(code, currentInterval);
        }

        function changeInterval(interval) {
            currentInterval = interval;
            document.querySelectorAll('.interval-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.interval === interval));
            fetchHistoricalData(currentStock, interval);
        }

        function showLoading(show) {
            document.getElementById('chartLoading').style.display = show ? 'block' : 'none';
        }

        async function init() {
            loadStocks(); initChart(); updateCurrentStockLabel(); loadNotes(currentStock); updateAuthUI();
            generateDemoQuotes(); renderWatchlist();
            await Promise.all([fetchHistoricalData(currentStock, currentInterval), fetchQuotes()]);
            setInterval(() => fetchQuotes(), 60000);
        }

        init();
    </script>
</body>
